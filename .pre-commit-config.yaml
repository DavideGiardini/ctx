# Local back pressure on every commit. Install once with: uv run pre-commit install
# This mirrors the full scripts/check.sh gate: ruff (autofix) + mypy + pytest.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + import sort, autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
      - id: mypy
        name: mypy (type check)
        entry: uv run mypy .
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
      - id: pytest
        name: pytest (test suite)
        entry: uv run pytest -q -n auto
        language: system
        # always_run so the suite gates EVERY commit, even one that touches no
        # Python files (docs, config, etc.) — the full gate is never skipped.
        always_run: true
        require_serial: true
        pass_filenames: false
