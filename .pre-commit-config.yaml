# Fast local back pressure. Install once with: uv run pre-commit install
# These mirror the cheap half of scripts/check.sh (the full gate also runs pytest).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + import sort, autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
      - id: mypy
        name: mypy (type check)
        entry: uv run mypy .
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
