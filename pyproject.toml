[project]
name = "ctx"
version = "0.1.0"
description = "A terminal chat application with streaming and model switching"
requires-python = ">=3.11"
dependencies = [
    "textual",
    "litellm",
]

[project.scripts]
ctx = "ctx.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
